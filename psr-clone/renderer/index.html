<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steps Recorder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1 class="title">Steps Recorder</h1>
      <p class="subtitle">Record steps to reproduce a problem</p>
    </header>

    <div class="content">
      <div id="idle-state" class="state">
        <div class="settings-row">
          <label for="max-screenshots">Number of recent screen captures to store:</label>
          <input type="number" id="max-screenshots" min="1" max="999" value="25">
        </div>
        <div class="settings-row">
          <label><input type="checkbox" id="record-video" /> Record video (MP4)</label>
          <span class="label-inline">FPS:</span>
          <input type="number" id="video-fps" min="1" max="10" value="3" class="input-small">
        </div>
        <div class="settings-row export-formats">
          <span class="label-inline">Export:</span>
          <label><input type="checkbox" id="export-html" checked /> HTML</label>
          <label><input type="checkbox" id="export-pdf" /> PDF</label>
          <label><input type="checkbox" id="export-md" /> Markdown</label>
        </div>
        <button id="btn-start" class="btn btn-primary">Start Record</button>
      </div>

      <div id="recording-state" class="state hidden">
        <div class="step-count">
          <span id="step-count">0</span> steps recorded
        </div>
        <div class="actions">
          <button id="btn-add-comment" class="btn btn-secondary">Add Comment</button>
          <button id="btn-stop" class="btn btn-primary btn-stop">Stop Record</button>
        </div>
      </div>
    </div>

    <div id="save-dialog" class="save-dialog hidden">
      <p>Recording saved.</p>
      <div id="save-buttons" class="save-buttons"></div>
      <button type="button" class="btn btn-secondary btn-done">Done</button>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
